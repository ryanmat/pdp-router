# Description: CI for the pdp-router public mirror.
# Description: Proves the package installs and tests green standalone (no private deps).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
