# Description: PDP routing intelligence -- public mirror build manifest.
# Description: Owned by the mirror (not synced); omits private-only deps. Version follows upstream on bump.

[project]
name = "pdp-router"
version = "0.9.0"
description = "Outcome-fed routing across heterogeneous AI models: confidence cascade, Thompson Sampling bandit, multi-model panel"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Matuszewski" }]
requires-python = ">=3.11,<3.14"
keywords = [
    "llm",
    "llm-routing",
    "model-routing",
    "thompson-sampling",
    "multi-model",
    "openai-compatible",
    "bandit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.50.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "openlit>=1.42.0",
    "traceloop-sdk>=0.30.0",
]

[project.urls]
Repository = "https://github.com/ryanmat/pdp-router"
Issues = "https://github.com/ryanmat/pdp-router/issues"

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
# python-dotenv is declared rather than leaned on: uvicorn[standard] happens to
# pull it in today, and the .env loading in the entry point must not depend on
# that. This repo ships no uv.lock, so CI resolves fresh per matrix Python.
proxy = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "python-dotenv>=1.0.0"]
# Persistent user memory: ONNX embedder + cross-encoder on CPU (numpy,
# onnxruntime, tokenizers; no torch). Imported lazily inside the memory
# module, so a proxy with the memory flags off never loads onnxruntime even
# with the extra installed. 0.8.x is the only line verified against the
# wrapper contract (TextEmbedding / TextCrossEncoder with cache_dir).
memory = ["fastembed>=0.8.0,<0.9"]

[project.scripts]
pdp-router-proxy = "pdp_router.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdp_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_models: tests that load the real embedding models (network + ~150 MB on first run; excluded by default)",
]
# Excluded by default so CI (`uv sync --all-extras`) and a bare `pytest` never
# download model files; run them on purpose with `pytest -m requires_models`.
addopts = "-m 'not requires_models'"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    # Test-time only: the memory retrieval math (cosine, dedup, block
    # ordering) is exercised with a fake embedder, which needs numpy without
    # the full `memory` extra. The runtime gets numpy through that extra and
    # imports it lazily, so this pin never puts it on the proxy import path.
    "numpy>=1.26",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
